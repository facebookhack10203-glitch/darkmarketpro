<!DOCTYPE html>
<html>
<head>
  <title>DarkMarket Admin</title>

  <style>
    body{
      background:#000;
      color:white;
      font-family:Arial;
      padding:20px;
    }

    h1{
      color:#00ff88;
    }

    .box{
      background:#111;
      padding:20px;
      border-radius:15px;
      margin-top:20px;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:10px;
      background:#222;
      border:none;
      color:white;
      border-radius:10px;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      background:#0066ff;
      color:white;
      font-size:16px;
    }

    .product{
      background:#1a1a1a;
      padding:15px;
      border-radius:10px;
      margin-top:15px;
    }

    img{
      width:100%;
      border-radius:10px;
      margin-top:10px;
    }

    .edit{
      background:orange;
      margin-top:10px;
    }

    .delete{
      background:red;
      margin-top:10px;
    }
  </style>
</head>

<body>

<h1>⚡ DarkMarket Admin Panel</h1>

<div class="box">
  <h2>Add Product</h2>

  <input type="text" id="name" placeholder="Product Name">

  <input type="text" id="price" placeholder="Price">

  <input type="text" id="image" placeholder="Image URL">

  <button onclick="addProduct()">Add Product</button>
</div>

<div class="box">
  <h2>All Products</h2>

  <div id="products"></div>
</div>

<script>

let products = JSON.parse(localStorage.getItem("products")) || [];

function saveProducts(){
  localStorage.setItem("products", JSON.stringify(products));
}

function showProducts(){

  let box = document.getElementById("products");

  box.innerHTML = "";

  products.forEach((item,index)=>{

    box.innerHTML += `
    
    <div class="product">

      <h3>${item.name}</h3>

      <p>${item.price}</p>

      <img src="${item.image}">

      <button class="edit" onclick="editProduct(${index})">
      Edit
      </button>

      <button class="delete" onclick="deleteProduct(${index})">
      Delete
      </button>

    </div>

    `;
  });

}

function addProduct(){

  let name = document.getElementById("name").value;

  let price = document.getElementById("price").value;

  let image = document.getElementById("image").value;

  if(name=="" || price=="" || image==""){
    alert("সব ঘর পূরণ করো");
    return;
  }

  products.push({
    name:name,
    price:price,
    image:image
  });

  saveProducts();

  showProducts();

  document.getElementById("name").value="";
  document.getElementById("price").value="";
  document.getElementById("image").value="";

}

function deleteProduct(index){

  products.splice(index,1);

  saveProducts();

  showProducts();

}

function editProduct(index){

  let newName = prompt("New Product Name", products[index].name);

  let newPrice = prompt("New Price", products[index].price);

  let newImage = prompt("New Image URL", products[index].image);

  products[index] = {
    name:newName,
    price:newPrice,
    image:newImage
  };

  saveProducts();

  showProducts();

}

showProducts();

</script>

</body>
</html>
