<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DarkMarketPro</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#000;
color:white;
}

.auth-box{
width:90%;
max-width:400px;
background:#111;
padding:25px;
border-radius:20px;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
box-shadow:0 0 20px rgba(0,255,136,0.3);
}

.auth-box h1{
text-align:center;
margin-bottom:20px;
color:#00ff88;
}

.auth-box input{
width:100%;
padding:15px;
margin-top:12px;
border:none;
border-radius:12px;
background:#222;
color:white;
font-size:16px;
}

.auth-box button{
width:100%;
padding:15px;
margin-top:18px;
border:none;
border-radius:12px;
background:#0066ff;
color:white;
font-size:18px;
font-weight:bold;
}

.switch-text{
margin-top:15px;
text-align:center;
font-size:14px;
}

.switch-text span{
color:#00ff88;
font-weight:bold;
}

#website{
display:none;
padding-bottom:100px;
}

header{
padding:20px;
text-align:center;
font-size:40px;
font-weight:bold;
color:#00ff88;
border-bottom:2px solid #00ff88;
}

.category-title{
padding:20px;
font-size:30px;
font-weight:bold;
}

.products{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
padding:15px;
}

.card{
background:#111;
padding:15px;
border-radius:20px;
}

.card img{
width:100%;
height:200px;
object-fit:cover;
border-radius:15px;
}

.card h2{
margin-top:10px;
font-size:20px;
}

.price{
margin-top:8px;
font-size:22px;
font-weight:bold;
color:#00ff88;
}

.buy-btn{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:12px;
background:#0066ff;
color:white;
font-size:16px;
font-weight:bold;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#111;
display:flex;
justify-content:space-around;
padding:15px 0;
border-top:1px solid #222;
}

.bottom-nav div{
text-align:center;
font-size:16px;
font-weight:bold;
}
</style>
</head>
<body>

<!-- LOGIN -->

<div class="auth-box" id="loginBox">

<h1>Login</h1>

<input type="email" id="loginEmail" placeholder="Enter Gmail">

<input type="password" id="loginPassword" placeholder="Enter Password">

<button onclick="login()">Login</button>

<div class="switch-text">
Don't have account?
<span onclick="showRegister()">
Create Account
</span>
</div>

</div>

<!-- REGISTER -->

<div class="auth-box" id="registerBox" style="display:none;">

<h1>Create Account</h1>

<input type="text" id="regName" placeholder="Your Name">

<input type="email" id="regEmail" placeholder="Enter Gmail">

<input type="password" id="regPassword" placeholder="Create Password">

<input type="password" id="regConfirm" placeholder="Confirm Password">

<button onclick="register()">
Create Account
</button>

<div class="switch-text">
Already have account?
<span onclick="showLogin()">
Login
</span>
</div>

</div>

<!-- WEBSITE -->

<div id="website">

<header>
DarkMarketPro
</header>

<div id="allCategories"></div>

<div class="bottom-nav">
<div>🏠<br>Home</div>
<div>📜<br>History</div>
<div>🛠️<br>Support</div>
</div>

</div>

<script>

function showRegister(){
document.getElementById("loginBox").style.display="none";
document.getElementById("registerBox").style.display="block";
}

function showLogin(){
document.getElementById("registerBox").style.display="none";
document.getElementById("loginBox").style.display="block";
}

function register(){

let name = document.getElementById("regName").value;
let email = document.getElementById("regEmail").value;
let pass = document.getElementById("regPassword").value;
let confirm = document.getElementById("regConfirm").value;

if(name=="" || email=="" || pass=="" || confirm==""){
alert("Fill all fields");
return;
}

if(pass != confirm){
alert("Password not match");
return;
}

localStorage.setItem("userEmail",email);
localStorage.setItem("userPassword",pass);

alert("Account Created Successfully");

showLogin();

}

function login(){

let email = document.getElementById("loginEmail").value;
let pass = document.getElementById("loginPassword").value;

let savedEmail = localStorage.getItem("userEmail");
let savedPass = localStorage.getItem("userPassword");

if(email == savedEmail && pass == savedPass){

document.getElementById("loginBox").style.display="none";
document.getElementById("website").style.display="block";

showProducts();

}else{
alert("Wrong Email or Password");
}
}

let products = JSON.parse(localStorage.getItem("products")) || [];

let container = document.getElementById("allCategories");

function showProducts(){

container.innerHTML = "";

let grouped = {};

products.forEach(item=>{

if(!grouped[item.category]){
grouped[item.category] = [];
}

grouped[item.category].push(item);

});

for(let category in grouped){

container.innerHTML += `
<div class="category-title">🔥 ${category}</div>
<div class="products" id="${category}"></div>
`;

let box = document.getElementById(category);

 grouped[category].forEach(product=>{

box.innerHTML += `
<div class="card">
<img src="${product.image}">
<h2>${product.name}</h2>
<div class="price">৳ ${product.price}</div>
<button class="buy-btn">Buy Now</button>
</div>
`;

});

}

}

</script>

</body>
</html>
