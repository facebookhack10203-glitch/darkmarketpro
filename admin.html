<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<style>

body{
margin:0;
padding:20px;
background:#000;
font-family:Arial;
color:white;
padding-bottom:100px;
}

h1{
text-align:center;
color:#00ff99;
font-size:40px;
}

.box{
background:#111;
padding:20px;
border-radius:20px;
margin-top:20px;
}

input,select{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:15px;
background:#222;
color:white;
font-size:18px;
box-sizing:border-box;
outline:none;
}

button{
width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:15px;
background:#00aa66;
color:white;
font-size:20px;
font-weight:bold;
}

.category-card,
.product-card{
background:#111;
padding:15px;
border-radius:20px;
margin-top:15px;
}

img{
width:100%;
border-radius:15px;
margin-top:10px;
}

.edit-btn{
background:#0066ff;
margin-top:10px;
}

.delete-btn{
background:red;
margin-top:10px;
}

</style>
</head>

<body>

<h1>🛠 Admin Panel</h1>

<!-- CATEGORY -->

<div class="box">

<h2>Add Category</h2>

<input type="text"
id="categoryName"
placeholder="Category Name">

<button onclick="addCategory()">
Add Category
</button>

</div>

<!-- PRODUCT -->

<div class="box">

<h2>Add Product</h2>

<input type="text"
id="productName"
placeholder="Product Name">

<input type="text"
id="productPrice"
placeholder="Product Price">

<input type="text"
id="productImage"
placeholder="Image URL">

<select id="productCategory">

</select>

<button onclick="addProduct()">
Add Product
</button>

</div>

<!-- CATEGORY LIST -->

<div class="box">

<h2>All Categories</h2>

<div id="categoryList"></div>

</div>

<!-- PRODUCT LIST -->

<div class="box">

<h2>All Products</h2>

<div id="productList"></div>

</div>

<!-- ORDER LIST -->

<div class="box">

<h2>Customer Orders</h2>

<div id="ordersList"></div>

</div>

<script>

let categories =
JSON.parse(localStorage.getItem("categories")) || [];

let products =
JSON.parse(localStorage.getItem("products")) || [];

function saveData(){

localStorage.setItem(
"categories",
JSON.stringify(categories)
);

localStorage.setItem(
"products",
JSON.stringify(products)
);

}

function loadCategories(){

let categoryList =
document.getElementById("categoryList");

let productCategory =
document.getElementById("productCategory");

categoryList.innerHTML = "";

productCategory.innerHTML = "";

categories.forEach((category,index)=>{

categoryList.innerHTML += `

<div class="category-card">

<h3>${category}</h3>

<button class="edit-btn"
onclick="editCategory(${index})">

Edit

</button>

<button class="delete-btn"
onclick="deleteCategory(${index})">

Delete

</button>

</div>

`;

productCategory.innerHTML += `

<option value="${category}">
${category}
</option>

`;

});

}

function addCategory(){

let categoryName =
document.getElementById("categoryName").value;

if(categoryName === ""){

alert("Enter Category Name");
return;

}

categories.push(categoryName);

saveData();

loadCategories();

document.getElementById("categoryName").value = "";

}

function deleteCategory(index){

categories.splice(index,1);

saveData();

loadCategories();

loadProducts();

}

function editCategory(index){

let newName =
prompt(
"Edit Category",
categories[index]
);

if(newName){

categories[index] = newName;

saveData();

loadCategories();

loadProducts();

}

}

function loadProducts(){

let productList =
document.getElementById("productList");

productList.innerHTML = "";

products.forEach((product,index)=>{

productList.innerHTML += `

<div class="product-card">

<h3>${product.name}</h3>

<p>
৳ ${product.price}
</p>

<p>
Category:
${product.category}
</p>

<img src="${product.image}">

<button class="edit-btn"
onclick="editProduct(${index})">

Edit

</button>

<button class="delete-btn"
onclick="deleteProduct(${index})">

Delete

</button>

</div>

`;

});

}

function addProduct(){

let name =
document.getElementById("productName").value;

let price =
document.getElementById("productPrice").value;

let image =
document.getElementById("productImage").value;

let category =
document.getElementById("productCategory").value;

if(
name === "" ||
price === "" ||
image === ""
){

alert("Fill All Fields");
return;

}

products.push({
name,
price,
image,
category
});

saveData();

loadProducts();

document.getElementById("productName").value = "";
document.getElementById("productPrice").value = "";
document.getElementById("productImage").value = "";

alert("Product Added");

}

function deleteProduct(index){

products.splice(index,1);

saveData();

loadProducts();

}

function editProduct(index){

let newName =
prompt(
"Edit Product Name",
products[index].name
);

if(newName){

products[index].name = newName;

saveData();

loadProducts();

}

}

function loadOrdersAdmin(){

let orders =
JSON.parse(localStorage.getItem("adminOrders")) || [];

let ordersList =
document.getElementById("ordersList");

ordersList.innerHTML = "";

if(orders.length === 0){

ordersList.innerHTML = `
<div class="product-card">
No Orders Yet
</div>
`;

return;

}

orders.forEach((order,index)=>{

ordersList.innerHTML += `

<div class="product-card">

<h3>${order.product}</h3>

<p>
Customer: ${order.name}
</p>

<p>
District: ${order.district}
</p>

<p>
Village: ${order.village}
</p>

<p>
Phone: ${order.phone}
</p>

<p>
Method: ${order.paymentMethod}
</p>

<p>
TRX ID: ${order.trxid}
</p>

<p>
Status: ${order.status}
</p>

<button class="edit-btn"
onclick="approveOrder(${index})">

Approve

</button>

<button class="delete-btn"
onclick="deleteOrder(${index})">

Delete

</button>

</div>

`;

});

}

function approveOrder(index){

let orders =
JSON.parse(localStorage.getItem("adminOrders")) || [];

orders[index].status = "Approved";

localStorage.setItem(
"adminOrders",
JSON.stringify(orders)
);

loadOrdersAdmin();

}

function deleteOrder(index){

let orders =
JSON.parse(localStorage.getItem("adminOrders")) || [];

orders.splice(index,1);

localStorage.setItem(
"adminOrders",
JSON.stringify(orders)
);

loadOrdersAdmin();

}

loadCategories();
loadProducts();
loadOrdersAdmin();

</script>

</body>
</html>
