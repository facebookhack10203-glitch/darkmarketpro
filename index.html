<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DarkMarketPro</title>

<style>

body{
margin:0;
padding:0;
background:black;
font-family:Arial;
color:white;
padding-bottom:90px;
}

.header{
text-align:center;
padding:25px;
font-size:42px;
font-weight:bold;
color:#00ff99;
border-bottom:2px solid #00ff99;
box-shadow:0 0 20px #00ff99;
}

.page{
display:none;
padding:20px;
}

.page.active{
display:block;
}

.search-box{
margin-top:20px;
}

.search-box input{
width:100%;
padding:18px;
border:none;
border-radius:20px;
background:#111;
color:white;
font-size:22px;
outline:none;
}

.section-title{
font-size:35px;
margin-top:40px;
margin-bottom:20px;
}

.products{
display:grid;
grid-template-columns:1fr;
gap:20px;
}

.product{
background:#111;
padding:15px;
border-radius:20px;
}

.product img{
width:100%;
border-radius:15px;
}

.product h3{
font-size:28px;
}

.product p{
font-size:22px;
color:#00ff99;
}

.buy-btn{
display:block;
text-align:center;
padding:15px;
background:#00aa66;
color:white;
text-decoration:none;
border-radius:15px;
font-size:22px;
font-weight:bold;
margin-top:10px;
}

.history-box{
background:#111;
padding:30px;
border-radius:20px;
font-size:28px;
text-align:center;
margin-top:50px;
}

.support-box{
margin-top:60px;
text-align:center;
}

.support-btn{
display:inline-block;
padding:20px 30px;
background:#0088cc;
color:white;
font-size:28px;
font-weight:bold;
text-decoration:none;
border-radius:20px;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#111;
display:flex;
justify-content:space-around;
padding:12px 0;
border-top:1px solid #333;
}

.nav-btn{
background:none;
border:none;
color:white;
font-size:24px;
}

</style>
</head>

<body>

<div class="header">
DarkMarketPro
</div>

<!-- HOME PAGE -->

<div id="homePage" class="page active">

<div class="search-box">
<input type="text" placeholder="🔎 Search Products">
</div>

<h2 class="section-title">🔥 Trending Products</h2>

<div class="products">

<div class="product">
<img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=1000&auto=format&fit=crop">

<h3>iPhone 15 Pro</h3>

<p>$999</p>

<a class="buy-btn"
onclick="addOrder('iPhone 15 Pro')">
Buy Now
</a>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=1000&auto=format&fit=crop">

<h3>Nike Shoes</h3>

<p>$120</p>

<a class="buy-btn"
onclick="addOrder('Nike Shoes')">
Buy Now
</a>
</div>

</div>
</div>

<!-- HISTORY PAGE -->

<div id="historyPage" class="page">

<h2 class="section-title">📜 Order History</h2>

<div id="historyContent" class="history-box">
No Order History
</div>

</div>

<!-- SUPPORT PAGE -->

<div id="supportPage" class="page">

<h2 class="section-title">🛠 Support</h2>

<div class="support-box">

<a class="support-btn"
href="https://t.me/Yangchun11"
target="_blank">

📩 Contact Telegram Support

</a>

</div>

</div>

<!-- BOTTOM NAV -->

<div class="bottom-nav">

<button class="nav-btn"
onclick="showPage('homePage')">

🏠 Home

</button>

<button class="nav-btn"
onclick="showPage('historyPage')">

📜 History

</button>

<button class="nav-btn"
onclick="showPage('supportPage')">

🛠 Support

</button>

</div>

<script>

function showPage(pageId){

document.querySelectorAll('.page').forEach(page=>{
page.classList.remove('active');
});

document.getElementById(pageId).classList.add('active');

}

function addOrder(productName){

let orders = JSON.parse(localStorage.getItem('orders')) || [];

orders.push(productName);

localStorage.setItem('orders', JSON.stringify(orders));

loadOrders();

alert(productName + ' Ordered Successfully');

}

function loadOrders(){

let orders = JSON.parse(localStorage.getItem('orders')) || [];

let historyContent = document.getElementById('historyContent');

if(orders.length === 0){

historyContent.innerHTML = 'No Order History';

}else{

historyContent.innerHTML = '';

orders.forEach(order=>{

historyContent.innerHTML += `
<div style="
background:#000;
padding:15px;
margin-top:15px;
border-radius:15px;
font-size:24px;
">
✅ ${order}
</div>
`;

});

}

}

loadOrders();

</script>

</body>
</html>
