<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DarkMarketPro</title>

<link rel="stylesheet" href="style.css">

<style>

.page{
display:none;
}

.page.active{
display:block;
}

.history-box{
background:#111;
padding:25px;
margin:20px;
border-radius:20px;
font-size:22px;
text-align:center;
}

.support-box{
padding:30px;
text-align:center;
}

.support-btn{
display:inline-block;
padding:18px 25px;
background:#0088cc;
color:white;
text-decoration:none;
border-radius:15px;
font-size:22px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="header">
DarkMarketPro
</div>

<!-- HOME PAGE -->

<div id="homePage" class="page active">

<div class="search-box">

<input type="text"
placeholder="🔎 Search Products">

</div>

<div id="categoriesContainer">

</div>

</div>

<!-- HISTORY PAGE -->

<div id="historyPage" class="page">

<div class="history-box"
id="historyContent">

এখনো পর্যন্ত কোনো অর্ডার করা হয়নি

</div>

</div>

<!-- SUPPORT PAGE -->

<div id="supportPage" class="page">

<div class="support-box">

<a class="support-btn"
href="https://t.me/Yangchun11"
target="_blank">

📩 Telegram Support

</a>

</div>

</div>

<!-- BOTTOM NAV -->

<div class="bottom-nav">

<button onclick="showPage('homePage')">
🏠 Home
</button>

<button onclick="showPage('historyPage')">
📜 History
</button>

<button onclick="showPage('supportPage')">
🛠 Support
</button>

</div>

<script src="script.js"></script>

<script>

function showPage(pageId){

document.querySelectorAll('.page')
.forEach(page=>{
page.classList.remove('active');
});

document.getElementById(pageId)
.classList.add('active');

}

</script>

</body>
</html>
