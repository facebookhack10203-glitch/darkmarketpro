<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DarkMarketPro</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:black;
color:white;
padding-bottom:100px;
}

header{
text-align:center;
padding:30px 20px;
border-bottom:3px solid #00ff99;
box-shadow:0 0 20px #00ff99;
}

header h1{
font-size:60px;
color:#00ff99;
}

.logo{
width:220px;
height:220px;
object-fit:cover;
display:block;
margin:30px auto;
border-radius:20px;
}

.search-box{
width:90%;
margin:20px auto;
background:#111;
padding:20px;
border-radius:25px;
}

.search-box input{
width:100%;
background:none;
border:none;
outline:none;
color:white;
font-size:28px;
}

.section-title{
font-size:55px;
font-weight:bold;
margin:40px 30px;
}

.products{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
padding:20px;
}

.card{
background:#111;
width:320px;
padding:20px;
border-radius:25px;
box-shadow:0 0 20px #00ff99;
text-align:center;
}

.card img{
width:100%;
height:260px;
object-fit:cover;
border-radius:20px;
}

.card h2{
margin-top:20px;
font-size:40px;
}

.card p{
font-size:38px;
margin-top:15px;
color:#00ff99;
font-weight:bold;
}

.buy-btn{
margin-top:20px;
padding:18px 35px;
border:none;
border-radius:18px;
background:#0066ff;
color:white;
font-size:30px;
font-weight:bold;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#111;
display:flex;
justify-content:space-around;
padding:18px 0;
border-top:2px solid #222;
}

.nav-btn{
background:none;
border:none;
color:white;
font-size:20px;
font-weight:bold;
}

.section{
display:none;
}

.active{
display:block;
}

.history-box{
background:#111;
margin:40px 20px;
padding:30px;
border-radius:25px;
text-align:center;
font-size:30px;
box-shadow:0 0 20px #00ff99;
}

.support-box{
padding:40px;
text-align:center;
}

.support-btn{
display:inline-block;
padding:20px 35px;
background:#0088cc;
color:white;
text-decoration:none;
border-radius:20px;
font-size:28px;
font-weight:bold;
}

</style>
</head>

<body>

<header>
<h1>DarkMarketPro</h1>
</header>

<div id="homePage" class="section active">

<img src="logo.png" class="logo">

<div class="search-box">
<input type="text" placeholder="🔎 Search Products">
</div>

<h2 class="section-title">🔥 Trending Products</h2>

<div class="products" id="productsContainer">

</div>

</div>

<div id="historyPage" class="section">

<div class="history-box">
📜 এখনো পর্যন্ত কোনো অর্ডার করা হয়নি
</div>

</div>

<div id="supportPage" class="section">

<div class="support-box">

<a class="support-btn" href="https://t.me/Yangchun11" target="_blank">
📩 Contact Telegram Support
</a>

</div>

</div>

<div class="bottom-nav">

<button class="nav-btn" onclick="showPage('homePage')">
🏠<br>Home
</button>

<button class="nav-btn" onclick="showPage('historyPage')">
📜<br>History
</button>

<button class="nav-btn" onclick="showPage('supportPage')">
🛠<br>Support
</button>

</div>

<script>

function showPage(pageId){

document.querySelectorAll('.section').forEach(section=>{
section.classList.remove('active');
});

document.getElementById(pageId).classList.add('active');

}

const products = JSON.parse(localStorage.getItem("products")) || [];

const productsContainer = document.getElementById("productsContainer");

products.forEach(product=>{

productsContainer.innerHTML += `

<div class="card">

<img src="${product.image}">

<h2>${product.name}</h2>

<p>৳ ${product.price}</p>

<button class="buy-btn">
Buy Now
</button>

</div>

`;

});

</script>

</body>
</html>
