<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DarkMarketPro</title>

<style>

body{
margin:0;
padding:0;
background:#000;
font-family:Arial;
color:white;
}

.topbar{
padding:15px;
text-align:center;
box-shadow:0 0 15px #00ff88;
}

.logo{
width:180px;
display:block;
margin:auto;
}

.search-box{
padding:20px;
}

.search-box input{
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:#111;
color:white;
font-size:18px;
outline:none;
box-sizing:border-box;
}

.category{
padding:15px;
}

.category-title{
font-size:34px;
font-weight:bold;
margin-bottom:20px;
}

.products{
display:flex;
gap:15px;
overflow-x:auto;
}

.card{
min-width:230px;
background:#0d0d0d;
padding:15px;
border-radius:25px;
text-align:center;
box-shadow:0 0 15px rgba(0,255,136,0.2);
}

.card img{
width:100%;
height:240px;
object-fit:cover;
border-radius:20px;
}

.card h2{
font-size:22px;
margin-top:15px;
}

.price{
font-size:34px;
font-weight:bold;
color:#00ff88;
margin-top:10px;
}

.buy-btn{
display:block;
margin-top:20px;
background:#0066ff;
padding:15px;
border-radius:18px;
text-decoration:none;
color:white;
font-size:28px;
font-weight:bold;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#0b0b0b;
display:flex;
justify-content:space-around;
padding:15px 0;
border-top:1px solid #222;
}

.bottom-nav a{
color:white;
text-decoration:none;
font-size:18px;
text-align:center;
font-weight:bold;
}

.space{
height:120px;
}

</style>
</head>

<body>

<div class="topbar">
<img src="logo.png" class="logo">
</div>

<div class="search-box">
<input type="text" placeholder="🔎 Search Products">
</div>

<div class="category">

<div class="category-title">
🔥 Trending Products
</div>

<div class="products">

<div class="card">
<img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9">
<h2>iPhone 15 Pro</h2>
<div class="price">৳ 85000</div>
<a class="buy-btn" href="#">Buy Now</a>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853">
<h2>Gaming Laptop</h2>
<div class="price">৳ 65000</div>
<a class="buy-btn" href="#">Buy Now</a>
</div>

</div>
</div>

<div class="category">

<div class="category-title">
🎮 Gaming Products
</div>

<div class="products">

<div class="card">
<img src="https://images.unsplash.com/photo-1606144042614-b2417e99c4e3">
<h2>PS5 Controller</h2>
<div class="price">৳ 5500</div>
<a class="buy-btn" href="#">Buy Now</a>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1593305841991-05c297ba4575">
<h2>Gaming Mouse</h2>
<div class="price">৳ 2500</div>
<a class="buy-btn" href="#">Buy Now</a>
</div>

</div>
</div>

<div class="space"></div>

<div class="bottom-nav">

<a href="#">
🏠<br>Home
</a>

<a href="#">
📜<br>History
</a>

<a href="#">
🛠️<br>Support
</a>

</div>

</body>
</html>
