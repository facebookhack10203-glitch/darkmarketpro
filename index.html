<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DarkMarketPro</title>

<style>

body{
margin:0;
padding:0;
background:#000;
font-family:Arial;
color:white;
padding-bottom:90px;
}

.header{
text-align:center;
padding:25px;
font-size:40px;
font-weight:bold;
color:#00ff99;
border-bottom:2px solid #00ff99;
box-shadow:0 0 20px #00ff99;
}

.page{
display:none;
padding:20px;
}

.page.active{
display:block;
}

.search-box{
margin-top:20px;
}

.search-box input{
width:100%;
padding:18px;
border:none;
border-radius:20px;
background:#111;
color:white;
font-size:22px;
outline:none;
}

.section-title{
font-size:34px;
margin-top:30px;
margin-bottom:20px;
}

.products{
display:grid;
grid-template-columns:1fr;
gap:20px;
}

.product{
background:#111;
padding:15px;
border-radius:20px;
}

.product img{
width:100%;
border-radius:15px;
}

.product h3{
font-size:28px;
}

.product p{
font-size:22px;
color:#00ff99;
}

.buy-btn{
display:block;
text-align:center;
padding:15px;
background:#00aa66;
color:white;
text-decoration:none;
border-radius:15px;
font-size:22px;
font-weight:bold;
margin-top:10px;
border:none;
}

.history-box{
background:#111;
padding:30px;
border-radius:20px;
font-size:26px;
text-align:center;
margin-top:50px;
}

.support-box{
margin-top:60px;
text-align:center;
}

.support-btn{
display:inline-block;
padding:20px 30px;
background:#0088cc;
color:white;
font-size:26px;
font-weight:bold;
text-decoration:none;
border-radius:20px;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#111;
display:flex;
justify-content:space-around;
padding:12px 0;
border-top:1px solid #333;
}

.nav-btn{
background:none;
border:none;
color:white;
font-size:20px;
font-weight:bold;
}

.admin-btn{
position:fixed;
top:15px;
right:15px;
background:#00aa66;
padding:12px 18px;
border-radius:15px;
text-decoration:none;
color:white;
font-weight:bold;
z-index:999;
}

</style>
</head>

<body>

<a href="admin.html" class="admin-btn">
Admin
</a>

<div class="header">
DarkMarketPro
</div>

<!-- HOME PAGE -->

<div id="homePage" class="page active">

<div class="search-box">
<input type="text" placeholder="🔎 Search Products">
</div>

<h2 class="section-title">
🔥 Trending Products
</h2>

<div class="products" id="productsContainer">

</div>

</div>

<!-- HISTORY PAGE -->

<div id="historyPage" class="page">

<h2 class="section-title">
📜 Order History
</h2>

<div id="historyContent" class="history-box">
এখনো পর্যন্ত কোনো অর্ডার করা হয়নি
</div>

</div>

<!-- SUPPORT PAGE -->

<div id="supportPage" class="page">

<h2 class="section-title">
🛠 Support
</h2>

<div class="support-box">

<a class="support-btn"
href="https://t.me/Yangchun11"
target="_blank">

📩 Contact Telegram Support

</a>

</div>

</div>

<!-- BOTTOM NAV -->

<div class="bottom-nav">

<button class="nav-btn"
onclick="showPage('homePage')">

🏠 Home

</button>

<button class="nav-btn"
onclick="showPage('historyPage')">

📜 History

</button>

<button class="nav-btn"
onclick="showPage('supportPage')">

🛠 Support

</button>

</div>

<script>

function showPage(pageId){

document.querySelectorAll('.page').forEach(page=>{
page.classList.remove('active');
});

document.getElementById(pageId).classList.add('active');

}

const products = JSON.parse(localStorage.getItem("products")) || [];

const productsContainer = document.getElementById("productsContainer");

if(products.length === 0){

productsContainer.innerHTML = `
<div class="history-box">
No Products Added
</div>
`;

}else{

products.forEach(product=>{

productsContainer.innerHTML += `

<div class="product">

<img src="${product.image}">

<h3>${product.name}</h3>

<p>৳ ${product.price}</p>

<button class="buy-btn"
onclick="addOrder('${product.name}')">

Buy Now

</button>

</div>

`;

});

}

function addOrder(productName){

let orders = JSON.parse(localStorage.getItem("orders")) || [];

orders.push(productName);

localStorage.setItem("orders", JSON.stringify(orders));

loadOrders();

alert(productName + ' Ordered Successfully');

}

function loadOrders(){

let orders = JSON.parse(localStorage.getItem("orders")) || [];

let historyContent = document.getElementById('historyContent');

if(orders.length === 0){

historyContent.innerHTML = 'এখনো পর্যন্ত কোনো অর্ডার করা হয়নি';

}else{

historyContent.innerHTML = '';

orders.forEach(order=>{

historyContent.innerHTML += `

<div style="
background:#000;
padding:15px;
margin-top:15px;
border-radius:15px;
font-size:22px;
">

✅ ${order}

</div>

`;

});

}

}

loadOrders();

</script>

</body>
</html>
