<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DarkMarketPro</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="header">
DarkMarketPro
</div>

<!-- HOME PAGE -->

<div id="homePage" class="page active">

<div class="search-box">

<input type="text"
placeholder="🔎 Search Products">

</div>

<div id="categoriesContainer">

</div>

</div>

<!-- HISTORY PAGE -->

<div id="historyPage" class="page">

<div class="history-box"
id="historyContent">

এখনো পর্যন্ত কোনো অর্ডার করা হয়নি

</div>

</div>

<!-- SUPPORT PAGE -->

<div id="supportPage" class="page">

<div class="support-box">

<a class="support-btn"
href="https://t.me/Yangchun11"
target="_blank">

📩 Telegram Support

</a>

</div>

</div>

<!-- BOTTOM NAV -->

<div class="bottom-nav">

<button onclick="showPage('homePage')">
🏠 Home
</button>

<button onclick="showPage('historyPage')">
📜 History
</button>

<button onclick="showPage('supportPage')">
🛠 Support
</button>

</div>

<script>

function showPage(pageId){

document.querySelectorAll('.page')
.forEach(page=>{
page.classList.remove('active');
});

document.getElementById(pageId)
.classList.add('active');

}

</script>

<script src="script.js"></script>

</body>
</html>
