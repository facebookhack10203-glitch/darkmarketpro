<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DarkMarketPro</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#000;
color:white;
padding-bottom:100px;
}

header{
text-align:center;
padding:25px;
font-size:28px;
font-weight:bold;
color:#00ff99;
border-bottom:2px solid #00ff99;
box-shadow:0 0 20px #00ff99;
}

.logo{
display:flex;
justify-content:center;
margin-top:25px;
}

.logo img{
width:180px;
border-radius:20px;
}

.search-box{
padding:20px;
}

.search-box input{
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:#111;
color:white;
font-size:20px;
outline:none;
}

.category-title{
font-size:40px;
font-weight:bold;
padding:20px;
}

.products{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
padding:10px;
}

.product{
background:#111;
width:170px;
border-radius:20px;
padding:15px;
text-align:center;
box-shadow:0 0 15px #00ff9950;
}

.product img{
width:100%;
height:180px;
object-fit:cover;
border-radius:15px;
}

.product h3{
margin-top:10px;
font-size:24px;
}

.product p{
color:#00ff99;
font-size:28px;
margin-top:10px;
font-weight:bold;
}

.buy-btn{
margin-top:15px;
background:#0066ff;
color:white;
border:none;
padding:15px;
width:100%;
border-radius:15px;
font-size:22px;
font-weight:bold;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#111;
display:flex;
justify-content:space-around;
padding:15px 0;
border-top:1px solid #222;
}

.nav-btn{
color:white;
font-size:18px;
text-align:center;
cursor:pointer;
}

.section{
display:none;
padding:20px;
}

.active{
display:block;
}

.history-box{
background:#111;
padding:20px;
border-radius:20px;
margin-top:20px;
font-size:22px;
text-align:center;
}

.support-btn{
display:block;
background:#0088cc;
padding:18px;
border-radius:15px;
text-align:center;
color:white;
font-size:24px;
font-weight:bold;
text-decoration:none;
margin-top:30px;
}
</style>
</head>

<body>

<header>
DarkMarketPro
</header>

<div class="logo">
<img src="logo.png">
</div>

<div id="homePage" class="active">

<div class="search-box">
<input type="text" placeholder="🔎 Search Products">
</div>

<div class="category-title">
🔥 Trending Products
</div>

<div class="products" id="products">

</div>

</div>

<div id="historyPage" class="section">

<h1>📜 Order History</h1>

<div class="history-box" id="historyBox">
No Order History
</div>

</div>

<div id="supportPage" class="section">

<h1>🛠 Support</h1>

<a class="support-btn" href="https://t.me/Yangchun11">
Contact Telegram Support
</a>

</div>

<div class="bottom-nav">

<div class="nav-btn" onclick="showHome()">
🏠<br>Home
</div>

<div class="nav-btn" onclick="showHistory()">
📜<br>History
</div>

<div class="nav-btn" onclick="showSupport()">
🛠<br>Support
</div>

</div>

<script>

function hideAll(){
document.getElementById("homePage").classList.remove("active");
document.getElementById("historyPage").classList.remove("active");
document.getElementById("supportPage").classList.remove("active");
}

function showHome(){
hideAll();
document.getElementById("homePage").classList.add("active");
}

function showHistory(){
hideAll();
document.getElementById("historyPage").classList.add("active");
}

function showSupport(){
hideAll();
document.getElementById("supportPage").classList.add("active");
}

</script>

</body>
</html>
