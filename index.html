<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DarkMarketPro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#000;
color:#fff;
padding-bottom:100px;
}

.header{
background:#111;
padding:20px;
text-align:center;
font-size:35px;
font-weight:bold;
color:#00ff99;
box-shadow:0 0 15px #00ff99;
position:sticky;
top:0;
z-index:999;
}

.search-box{
padding:15px;
}

.search-box input{
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:#111;
color:white;
font-size:18px;
outline:none;
}

.category{
margin:20px;
}

.category-title{
font-size:28px;
margin-bottom:15px;
color:#00ff99;
}

.products{
display:flex;
gap:15px;
overflow-x:auto;
padding-bottom:10px;
}

.product{
min-width:220px;
background:#111;
padding:15px;
border-radius:20px;
}

.product img{
width:100%;
height:200px;
object-fit:cover;
border-radius:15px;
}

.product h3{
margin-top:10px;
font-size:22px;
}

.product p{
margin-top:8px;
font-size:20px;
color:#00ff99;
font-weight:bold;
}

.buy-btn{
margin-top:12px;
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:#00aa66;
color:white;
font-size:18px;
font-weight:bold;
}

.page{
display:none;
padding:20px;
}

.page.active{
display:block;
}

.history-box{
background:#111;
padding:25px;
border-radius:20px;
font-size:22px;
text-align:center;
margin-top:40px;
}

.support-btn{
display:block;
background:#0088cc;
padding:18px;
border-radius:18px;
text-align:center;
color:white;
text-decoration:none;
font-size:22px;
font-weight:bold;
margin-top:50px;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#111;
display:flex;
justify-content:space-around;
padding:12px 0;
border-top:1px solid #333;
}

.nav-btn{
background:none;
border:none;
color:white;
font-size:18px;
font-weight:bold;
}

.admin-btn{
position:fixed;
top:15px;
right:15px;
background:#00aa66;
padding:10px 18px;
border-radius:12px;
text-decoration:none;
color:white;
font-weight:bold;
z-index:999;
}

.no-products{
background:#111;
padding:25px;
border-radius:20px;
text-align:center;
font-size:20px;
margin:20px;
}

</style>
</head>

<body>

<a href="admin.html" class="admin-btn">
Admin
</a>

<div class="header">
DarkMarketPro
</div>

<!-- HOME PAGE -->

<div id="homePage" class="page active">

<div class="search-box">
<input type="text" placeholder="🔎 Search Products">
</div>

<div id="categoriesContainer">

</div>

</div>

<!-- HISTORY PAGE -->

<div id="historyPage" class="page">

<div class="history-box" id="historyContent">
এখনো পর্যন্ত কোনো অর্ডার করা হয়নি
</div>

</div>

<!-- SUPPORT PAGE -->

<div id="supportPage" class="page">

<a class="support-btn"
href="https://t.me/Yangchun11"
target="_blank">

📩 Contact Telegram Support

</a>

</div>

<!-- BOTTOM NAV -->

<div class="bottom-nav">

<button class="nav-btn"
onclick="showPage('homePage')">

🏠 Home

</button>

<button class="nav-btn"
onclick="showPage('historyPage')">

📜 History

</button>

<button class="nav-btn"
onclick="showPage('supportPage')">

🛠 Support

</button>

</div>

<script>

function showPage(pageId){

document.querySelectorAll('.page').forEach(page=>{
page.classList.remove('active');
});

document.getElementById(pageId).classList.add('active');

}

let categories = JSON.parse(localStorage.getItem("categories")) || [];

let products = JSON.parse(localStorage.getItem("products")) || [];

const categoriesContainer =
document.getElementById("categoriesContainer");

if(categories.length === 0){

categoriesContainer.innerHTML = `
<div class="no-products">
No Categories Added
</div>
`;

}else{

categories.forEach(category=>{

let categoryProducts =
products.filter(
product => product.category === category
);

let productHTML = "";

if(categoryProducts.length === 0){

productHTML = `
<div class="no-products">
No Products Added
</div>
`;

}else{

categoryProducts.forEach(product=>{

productHTML += `

<div class="product">

<img src="${product.image}">

<h3>${product.name}</h3>

<p>৳ ${product.price}</p>

<button class="buy-btn"
onclick="addOrder('${product.name}')">

Buy Now

</button>

</div>

`;

});

}

categoriesContainer.innerHTML += `

<div class="category">

<div class="category-title">
${category}
</div>

<div class="products">
${productHTML}
</div>

</div>

`;

});

}

function addOrder(productName){

let orders =
JSON.parse(localStorage.getItem("orders")) || [];

orders.push(productName);

localStorage.setItem(
"orders",
JSON.stringify(orders)
);

loadOrders();

alert(productName + " Ordered");

}

function loadOrders(){

let orders =
JSON.parse(localStorage.getItem("orders")) || [];

let historyContent =
document.getElementById("historyContent");

if(orders.length === 0){

historyContent.innerHTML =
"এখনো পর্যন্ত কোনো অর্ডার করা হয়নি";

}else{

historyContent.innerHTML = "";

orders.forEach(order=>{

historyContent.innerHTML += `

<div style="
background:#000;
padding:15px;
margin-top:15px;
border-radius:15px;
">

✅ ${order}

</div>

`;

});

}

}

loadOrders();

</script>

</body>
</html>
