<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DarkMarketPro</title>

<style>

body{
margin:0;
padding:0;
background:black;
font-family:Arial;
color:white;
padding-bottom:90px;
}

header{
text-align:center;
padding:20px;
border-bottom:2px solid #00ff99;
box-shadow:0 0 20px #00ff99;
}

.logo{
width:120px;
height:120px;
object-fit:contain;
display:block;
margin:auto;
border-radius:20px;
}

.title{
font-size:50px;
font-weight:bold;
color:#00ff99;
margin-top:10px;
}

.search-box{
width:85%;
margin:30px auto;
background:#111;
padding:18px;
border-radius:20px;
box-shadow:0 0 20px #00ff99;
}

.search-box input{
width:100%;
background:none;
border:none;
outline:none;
color:white;
font-size:24px;
}

.section-title{
font-size:45px;
font-weight:bold;
margin:30px;
}

.category-box{
width:90%;
margin:auto;
background:#111;
padding:20px;
border-radius:20px;
margin-bottom:25px;
box-shadow:0 0 15px #00ff99;
}

.category-name{
font-size:35px;
font-weight:bold;
margin-bottom:15px;
color:#00ff99;
}

.empty-text{
font-size:24px;
color:gray;
text-align:center;
padding:40px 0;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#111;
display:flex;
justify-content:space-around;
padding:14px 0;
border-top:1px solid #333;
}

.bottom-nav button{
background:none;
border:none;
color:white;
font-size:20px;
font-weight:bold;
}

</style>
</head>

<body>

<header>

<img src="logo.png" class="logo">

<div class="title">
DarkMarketPro
</div>

</header>

<div class="search-box">
<input type="text" placeholder="🔎 Search Products">
</div>

<div class="section-title">
🔥 Trending Products
</div>

<div class="category-box">

<div class="category-name">
📱 Mobile
</div>

<div class="empty-text">
No Products Added
</div>

</div>

<div class="category-box">

<div class="category-name">
💻 Laptop
</div>

<div class="empty-text">
No Products Added
</div>

</div>

<div class="category-box">

<div class="category-name">
🎮 Gaming
</div>

<div class="empty-text">
No Products Added
</div>

</div>

<div class="bottom-nav">

<button onclick="goHome()">
🏠<br>Home
</button>

<button onclick="showHistory()">
📜<br>History
</button>

<button onclick="openSupport()">
🛠️<br>Support
</button>

</div>

<script>

function goHome(){
window.location.href="index.html";
}

function showHistory(){
alert("No History Yet");
}

function openSupport(){
window.location.href="https://t.me/yourusername";
}

</script>

</body>
</html>
