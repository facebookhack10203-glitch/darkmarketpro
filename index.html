<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DarkMarketPro</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#000;
color:white;
padding-bottom:100px;
}

header{
padding:20px;
text-align:center;
font-size:40px;
font-weight:bold;
color:#00ff88;
border-bottom:2px solid #00ff88;
box-shadow:0 0 20px #00ff88;
}

.search-box{
padding:20px;
}

.search-box input{
width:100%;
padding:18px;
border:none;
border-radius:20px;
background:#111;
color:white;
font-size:20px;
}

.category-title{
font-size:40px;
font-weight:bold;
padding:20px;
margin-top:10px;
}

.products{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
padding:15px;
}

.card{
background:#0d0d0d;
border-radius:25px;
padding:15px;
box-shadow:0 0 10px rgba(0,255,136,0.2);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:20px;
}

.card h2{
font-size:22px;
margin-top:15px;
}

.price{
font-size:24px;
color:#00ff88;
font-weight:bold;
margin-top:10px;
}

.buy-btn{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:15px;
background:#0066ff;
color:white;
font-size:20px;
font-weight:bold;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#111;
display:flex;
justify-content:space-around;
padding:15px 0;
border-top:1px solid #222;
}

.bottom-nav div{
text-align:center;
font-size:18px;
font-weight:bold;
}
</style>
</head>
<body>

<header>
DarkMarketPro
</header>

<div class="search-box">
<input type="text" id="search" placeholder="🔎 Search Products">
</div>

<div id="allCategories"></div>

<div class="bottom-nav">
<div>🏠<br>Home</div>
<div>📜<br>History</div>
<div>🛠️<br>Support</div>
</div>

<script>
let products = JSON.parse(localStorage.getItem("products")) || [];

let container = document.getElementById("allCategories");

function showProducts(){
container.innerHTML = "";

let grouped = {};

products.forEach(item=>{
if(!grouped[item.category]){
grouped[item.category] = [];
}

grouped[item.category].push(item);
});

for(let category in grouped){

container.innerHTML += `
<div class="category-title">🔥 ${category}</div>
<div class="products" id="${category}"></div>
`;

let box = document.getElementById(category);

 grouped[category].forEach(product=>{
box.innerHTML += `
<div class="card">
<img src="${product.image}">
<h2>${product.name}</h2>
<div class="price">৳ ${product.price}</div>
<button class="buy-btn">Buy Now</button>
</div>
`;
});
}
}

showProducts();
</script>

</body>
</html>
